name: Tao Phieu Dan Do BTVN A4 (Telegram -> Gemini -> PDF)

on:
  workflow_dispatch:
    inputs:
      message_text:
        description: 'Nội dung cô giáo dặn (để trống nếu muốn tự lấy tin nhắn mới nhất từ Bot Telegram)'
        required: false
        default: ''
      chat_id:
        description: 'Telegram Chat ID người gửi (tùy chọn)'
        required: false
        default: ''
      photo_file_id:
        description: 'Telegram Photo File ID nếu gửi ảnh (tùy chọn)'
        required: false
        default: ''
  repository_dispatch:
    types: [telegram_btvn]

jobs:
  build-btvn-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chrome and Vietnamese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable fonts-noto-core fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow google-generativeai python-telegram-bot==20.7

      - name: Generate High-Contrast A4 PDF and Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_MESSAGE_TEXT: ${{ github.event.inputs.message_text || github.event.client_payload.message_text || '' }}
          INPUT_CHAT_ID: ${{ github.event.inputs.chat_id || github.event.client_payload.chat_id || '' }}
          INPUT_PHOTO_FILE_ID: ${{ github.event.inputs.photo_file_id || github.event.client_payload.photo_file_id || '' }}
        run: |
          python -u btvn_bot.py

      - name: Commit state and generated PDF
        if: always()
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add btvn_state.json Report_BTVN/* || true
          git commit -m "Update BTVN A4 PDF and state" || echo "Nothing to commit"
          git pull --rebase || true
          git push || echo "Nothing to push"
